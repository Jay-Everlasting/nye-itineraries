<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NYE 2026→27 Trip Options</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --bg-sidebar:#fbfbfa;
    --bg-hover:#f1f1ef;
    --bg-active:#e8e8e6;
    --bg-callout:#f7f6f3;
    --border:#e9e9e7;
    --text:#37352f;
    --text-muted:#787774;
    --text-faint:#9b9a97;
    --blue-bg:#e7f3f8; --blue-text:#0b6e99;
    --yellow-bg:#fdecc8; --yellow-text:#8a5b0f;
    --red-bg:#ffe2dd; --red-text:#ad3a21;
    --green-bg:#ddf3e4; --green-text:#0f7a3d;
    --purple-bg:#eee3f8; --purple-text:#6b3fa0;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; display:flex; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
    font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  a{color:#2383e2; text-decoration:none;}
  a:hover{text-decoration:underline;}
  img{max-width:100%;}

  /* sidebar */
  .sidebar{
    width:250px; flex-shrink:0; background:var(--bg-sidebar); border-right:1px solid var(--border);
    height:100vh; position:sticky; top:0; overflow-y:auto; padding:18px 10px;
  }
  .side-title{padding:6px 10px 14px; font-size:12.5px; font-weight:600; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em;}
  .side-item{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:5px; cursor:pointer;
    font-size:14px; color:var(--text); margin-bottom:1px; min-height:40px;
  }
  .side-item:hover{background:var(--bg-hover);}
  .side-item.active{background:var(--bg-active); font-weight:600;}
  .side-icon{font-size:16px; flex-shrink:0;}
  .side-price{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--text-faint); flex-shrink:0;}
  .side-foot{padding:16px 10px 4px; font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--border); margin-top:10px; line-height:1.6;}

  /* main */
  .main{flex:1; min-width:0;}
  .page{display:none;}
  .page.active{display:block;}
  .page-inner{max-width:800px; margin:0 auto; padding:56px 40px 100px;}

  .page-icon{font-size:46px; line-height:1; margin-bottom:10px;}
  .page-inner h1{font-size:32px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em;}
  .page-sub{font-size:15px; color:var(--text-muted); margin-bottom:20px;}

  .props{border:1px solid var(--border); border-radius:6px; margin-bottom:16px; overflow:hidden;}
  .prow{display:flex; border-bottom:1px solid var(--border); font-size:13.5px;}
  .prow:last-child{border-bottom:none;}
  .plabel{width:150px; flex-shrink:0; padding:8px 12px; color:var(--text-muted); background:var(--bg-sidebar); display:flex; align-items:center; gap:6px;}
  .pvalue{padding:8px 12px; flex:1; display:flex; align-items:center;}
  .pvalue.strong{font-weight:600;}

  .pills{display:flex; gap:6px; margin:14px 0 28px; flex-wrap:wrap;}
  .pill{font-size:12px; padding:3px 10px; border-radius:4px; font-weight:600;}
  .pill.snow{background:var(--blue-bg); color:var(--blue-text);}
  .pill.nye{background:var(--yellow-bg); color:var(--yellow-text);}
  .pill.warm{background:var(--red-bg); color:var(--red-text);}
  .pill.aurora{background:var(--green-bg); color:var(--green-text);}
  .pill.src{background:var(--purple-bg); color:var(--purple-text);}

  hr.div{border:none; border-top:1px solid var(--border); margin:30px 0;}
  h2.sec{font-size:19px; font-weight:600; margin:0 0 12px; display:flex; align-items:center; gap:8px;}

  .mapbox{height:400px; border-radius:8px; border:1px solid var(--border); overflow:hidden; margin-bottom:6px; background:#f2f2f0;}
  .map-cap{font-size:12px; color:var(--text-faint); margin-bottom:30px;}
  .leaflet-popup-content{font-size:13px; font-family:-apple-system,sans-serif;}
  .leaflet-popup-content b{font-size:13.5px;}

  details.day{border:1px solid var(--border); border-radius:6px; margin-bottom:6px;}
  details.day summary{
    list-style:none; cursor:pointer; padding:10px 12px; display:flex; align-items:center; gap:10px; font-size:14px; min-height:40px;
  }
  details.day summary::-webkit-details-marker{display:none;}
  details.day summary::before{content:'▸'; color:var(--text-faint); font-size:10px; display:inline-block; transition:transform .12s; width:10px; flex-shrink:0;}
  details.day[open] summary::before{transform:rotate(90deg);}
  .day-badge{font-family:var(--mono); font-size:11px; color:var(--text-faint); width:16px; flex-shrink:0;}
  .day-date{font-size:12px; color:var(--text-faint); width:52px; flex-shrink:0;}
  .day-title{font-weight:500; flex:1; min-width:0;}
  .day-content{padding:0 12px 12px 48px; font-size:13.5px; color:var(--text-muted); line-height:1.55;}
  .day-tag{display:inline-block; margin-left:2px; font-size:10.5px; padding:1px 7px; border-radius:3px; font-weight:600;}

  .table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px 14px; padding:0 2px;}
  table.ntable{width:100%; min-width:520px; border-collapse:collapse; font-size:13.5px;}
  table.ntable th{text-align:left; padding:7px 10px; background:var(--bg-sidebar); color:var(--text-muted); font-weight:500; font-size:11.5px; text-transform:uppercase; letter-spacing:.02em; border-bottom:1px solid var(--border); white-space:nowrap;}
  table.ntable td{padding:9px 10px; border-bottom:1px solid var(--border); vertical-align:top;}
  table.ntable tr:hover td{background:var(--bg-hover);}
  .hname{font-weight:600;}
  .hsub{color:var(--text-faint); font-size:12px; margin-top:2px;}
  .hnote{color:var(--text-muted); font-size:12px; margin-top:4px; font-style:italic; line-height:1.45;}
  .hnote b{font-style:normal; color:var(--text);}
  .num{font-family:var(--mono); text-align:right; white-space:nowrap;}

  .flight-card{border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:10px;}
  .flight-leg{display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13.5px; flex-wrap:wrap;}
  .flight-leg:not(:last-of-type){border-bottom:1px dashed var(--border);}
  .flight-route{font-family:var(--mono); font-weight:600; min-width:100px;}
  .flight-meta{color:var(--text-muted); font-size:12.5px;}
  .flight-cost-row{
    display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px;
    border-top:1px solid var(--border); flex-wrap:wrap; gap:6px;
  }
  .flight-cost-row .lbl{font-size:12.5px; color:var(--text-muted);}
  .flight-cost-row .val{font-family:var(--mono); font-weight:700; font-size:15px;}

  .total-callout{
    background:var(--yellow-bg); border-radius:6px; padding:14px 18px; display:flex; justify-content:space-between;
    align-items:center; margin:6px 0 8px; flex-wrap:wrap; gap:6px;
  }
  .total-callout .label{font-size:13px; color:var(--yellow-text); font-weight:600;}
  .total-callout .val{font-family:var(--mono); font-size:21px; font-weight:700; color:var(--yellow-text);}

  .callout{background:var(--bg-callout); border-radius:6px; padding:10px 14px; font-size:12.5px; color:var(--text-muted); margin-top:6px; line-height:1.55;}
  .callout.flag{background:var(--red-bg); color:var(--red-text); font-weight:600; margin:0 0 20px;}

  /* ---------- tablet / small laptop ---------- */
  @media (max-width:820px){
    body{flex-direction:column;}
    .sidebar{width:100%; height:auto; position:static; display:flex; overflow-x:auto; padding:10px; gap:2px;}
    .side-title, .side-foot{display:none;}
    .side-item{flex-shrink:0;}
    .page-inner{padding:32px 18px 70px;}
    .plabel{width:120px;}
  }

  /* ---------- phones, incl. Galaxy S25 (~384-412px CSS width) ---------- */
  @media (max-width:480px){
    body{font-size:14px;}
    .sidebar{padding:8px 6px; gap:0;}
    .side-item{padding:7px 9px; font-size:13px; min-height:38px;}
    .side-price{font-size:9.5px;}
    .page-inner{padding:22px 14px 60px;}
    .page-icon{font-size:38px;}
    .page-inner h1{font-size:25px;}
    .page-sub{font-size:13.5px; margin-bottom:16px;}
    h2.sec{font-size:16.5px; margin-top:2px;}
    hr.div{margin:22px 0;}

    .prow{flex-direction:column; font-size:13px;}
    .plabel{width:100%; padding:6px 10px 2px; background:transparent; font-size:11.5px; color:var(--text-faint);}
    .pvalue{padding:0 10px 8px;}

    .mapbox{height:280px;}
    .map-cap{margin-bottom:20px; font-size:11px;}

    details.day summary{padding:9px 10px; font-size:13px; gap:7px;}
    .day-date{width:42px; font-size:11px;}
    .day-content{padding:0 10px 10px 40px; font-size:12.5px;}
    .day-tag{font-size:9.5px; padding:1px 5px;}

    table.ntable{font-size:12.5px; min-width:460px;}
    table.ntable th, table.ntable td{padding:7px 8px;}

    .flight-card{padding:12px 12px;}
    .flight-leg{font-size:12.5px; gap:6px;}
    .flight-route{min-width:80px; font-size:12px;}
    .flight-meta{font-size:11.5px;}
    .flight-cost-row .val{font-size:14px;}

    .total-callout{padding:12px 14px;}
    .total-callout .val{font-size:18px;}
    .callout{font-size:11.5px; padding:9px 12px;}
    .pill{font-size:11px; padding:3px 8px;}
  }

  /* ---------- combo itinerary: accommodation table + map linking ---------- */
  .geo-status{font-size:11.5px; color:var(--text-faint); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .geo-dot{width:7px; height:7px; border-radius:50%; background:#f0b429; animation:pulse 1.2s infinite ease-in-out; flex-shrink:0;}
  .geo-dot.done{background:#2ecc71; animation:none;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.3;}}

  .accom-group{margin-bottom:32px;}
  .accom-group-title{
    font-size:15px; font-weight:700; color:var(--text); margin:0 0 12px;
    display:flex; align-items:center; gap:10px; padding-bottom:9px; border-bottom:2px solid var(--border);
  }
  .accom-group-count{
    font-size:11px; font-weight:600; color:var(--text-faint); background:var(--bg-sidebar);
    padding:3px 9px; border-radius:20px; margin-left:auto; border:1px solid var(--border);
  }

  .accom-table-wrap{border:1px solid var(--border); border-radius:10px; overflow:hidden;}
  table.accom-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.accom-table th{
    text-align:left; padding:10px 14px; background:var(--bg-sidebar); color:var(--text-muted);
    font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
    border-bottom:1px solid var(--border); white-space:nowrap;
  }
  table.accom-table th.right, table.accom-table td.right{text-align:right;}
  table.accom-table td{padding:13px 14px; border-bottom:1px solid #f1f1ef; vertical-align:middle;}
  table.accom-table tr:last-child td{border-bottom:none;}
  table.accom-table tbody tr{transition:background .12s;}
  table.accom-table tbody tr:hover{background:var(--bg-hover);}
  table.accom-table tbody tr.selected{background:#f2fbf5;}
  table.accom-table tbody tr.selected:hover{background:#e9f7ee;}
  table.accom-table tbody tr.selected td:first-child{box-shadow:inset 3px 0 0 #0f7a3d;}
  table.accom-table tbody tr.highlight{background:#eaf4fd; box-shadow:inset 0 0 0 2px rgba(35,131,226,.4);}
  .accom-row{scroll-margin-top:24px;}

  .accom-name-cell{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .accom-name{font-weight:600; font-size:13.5px; line-height:1.4; color:var(--text);}
  .accom-tags{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .accom-selected-badge{
    display:inline-flex; align-items:center; gap:4px; background:#0f7a3d; color:#fff; font-size:10px; font-weight:700;
    padding:2px 8px; border-radius:20px; letter-spacing:.02em;
  }
  .accom-note{font-size:12px; font-style:italic; color:var(--text-muted); line-height:1.5; margin-top:2px;}
  .accom-price{font-family:var(--mono); font-weight:700; font-size:15px; color:var(--text); white-space:nowrap;}

  .accom-actions{display:flex; gap:7px; justify-content:flex-end;}
  .locate-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:5px; font-size:12px; font-weight:600; color:#fff;
    background:#2383e2; border:none; border-radius:7px; padding:8px 12px; cursor:pointer;
    min-height:36px; white-space:nowrap; transition:background .15s;
  }
  .locate-btn:hover{background:#1a6fc4;}
  .accom-link-btn{
    display:inline-flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--text);
    background:#fff; border:1px solid var(--border); border-radius:7px; padding:8px 12px; text-decoration:none;
    min-height:36px; white-space:nowrap; transition:background .15s, border-color .15s;
  }
  .accom-link-btn:hover{background:var(--bg-hover); border-color:#c3cede; text-decoration:none;}

  .popup-locate-link{display:inline-block; margin-top:6px; font-size:12px; font-weight:600; cursor:pointer; color:#2383e2;}

  /* phone: table collapses into stacked rows */
  @media (max-width:600px){
    .accom-table-wrap{border:none; border-radius:0;}
    table.accom-table thead{display:none;}
    table.accom-table, table.accom-table tbody, table.accom-table tr, table.accom-table td{display:block; width:100%;}
    table.accom-table tr{
      border:1px solid var(--border); border-radius:10px; margin-bottom:10px; padding:13px 14px;
      background:#fff; box-shadow:0 1px 2px rgba(16,24,40,.05);
    }
    table.accom-table tbody tr.selected{border-color:#0f7a3d; background:#f2fbf5;}
    table.accom-table tbody tr.selected td:first-child{box-shadow:none;}
    table.accom-table td{padding:0; border-bottom:none;}
    table.accom-table td.right{text-align:left;}
    table.accom-table td.price-cell{margin:8px 0 10px;}
    .accom-price{font-size:18px;}
    .accom-actions{justify-content:stretch; gap:8px;}
    .locate-btn, .accom-link-btn{flex:1; min-height:40px; font-size:12.5px;}
  }

  /* ---------- very narrow phones ---------- */
  @media (max-width:360px){

    .page-inner{padding:18px 10px 50px;}
    .page-inner h1{font-size:22px;}
    table.ntable{min-width:420px;}
  }
</style>
</head>

function windowTotals(w){
  const selHotel = w.hotels.find(h=>h.selected) || w.hotels[0];
  const flightsTotal = w.flight.costPerPerson * 2;
  const total = flightsTotal + selHotel.total;
  return {flightsTotal, accom:selHotel.total, total, pp:Math.round(total/2), selHotel};
}

function renderSidebar(){
  document.getElementById('side-list').innerHTML = DATA.map((it,i)=>{
    let priceLabel;
    if(it.isWindowPair){
      const t = it.windows.map(windowTotals);
      const lo = Math.min(...t.map(x=>x.pp)), hi = Math.max(...t.map(x=>x.pp));
      priceLabel = lo===hi ? fmt(lo) : `${fmt(lo)}–${fmt(hi)}`;
    } else if(it.hasLocationMap){
      const accomTotal = it.accommodations.filter(a=>a.selected).reduce((s,a)=>s+a.total,0);
      priceLabel = fmt(Math.round((it.flight.costPerPerson*2 + accomTotal)/2));
    } else {
      priceLabel = fmt(Math.round((it.flight.costPerPerson*2 + it.price.accom)/2));
    }
    return `<div class="side-item${i===0?' active':''}" data-id="${it.id}" onclick="selectPage('${it.id}')">
      <span class="side-icon">${it.icon}</span> ${it.name}
      <span class="side-price">${priceLabel}</span>
    </div>`;
  }).join('');
}

const mapInstances = {};
function initMap(it){
  if(mapInstances[it.id]){ setTimeout(()=>mapInstances[it.id].invalidateSize(),0); return; }
  const container = document.getElementById('map-'+it.id);
  const map = L.map(container, {scrollWheelZoom:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO', subdomains:'abcd', maxZoom:19
  }).addTo(map);

  const bounds = [];
  const latlngs = it.route.map(p=>[p.lat,p.lng]);
  L.polyline(latlngs, {color:'#2383e2', weight:2.5, opacity:0.75}).addTo(map);

  it.route.forEach(p=>{
    const isAms = p.code==='AMS';
    const stroke = p.tag==='snow' ? '#0b6e99' : p.tag==='nye' ? '#8a5b0f' : '#37352f';
    const fill = isAms ? '#ffffff' : (p.tag==='snow' ? '#e7f3f8' : p.tag==='nye' ? '#fdecc8' : '#ffffff');
    L.circleMarker([p.lat,p.lng], {radius:isAms?6:9, color:stroke, weight:2, fillColor:fill, fillOpacity:1})
      .addTo(map).bindPopup(`<b>${p.name}</b><br>${p.blurb||''}`);
    bounds.push([p.lat,p.lng]);
  });

  (it.daytrips||[]).forEach(p=>{
    const base = it.route.find(r=>r.code===p.from);
    if(base) L.polyline([[base.lat,base.lng],[p.lat,p.lng]], {color:'#9b9a97', weight:1.5, dashArray:'3 7'}).addTo(map);
    const stroke = p.tag==='snow' ? '#0b6e99' : '#787774';
    L.circleMarker([p.lat,p.lng], {radius:5.5, color:stroke, weight:2, fillColor:'#ffffff', fillOpacity:1})
      .addTo(map).bindPopup(`<b>${p.name}</b> <span style="color:#9b9a97">(day trip)</span><br>${p.blurb||''}`);
    bounds.push([p.lat,p.lng]);
  });

  map.fitBounds(bounds, {padding:[28,28]});
  mapInstances[it.id] = map;

  if(it.hasLocationMap && it.accommodations){
    geocodeAccommodations(it, map);
  }
}

const geocodeCache = {};
const accomMarkers = {};

// Austrian/Norwegian addresses often carry district notation ("19. Döbling",
// "02. Leopoldstadt") that Nominatim can't parse. Build progressively simpler
// query variants and use the first that resolves.
function addressVariants(address){
  const variants = [];
  const push = v => { v = v.replace(/\s*,\s*/g, ', ').replace(/,\s*,/g, ',').trim(); if(v && !variants.includes(v)) variants.push(v); };

  push(address);

  // drop "NN. DistrictName" segments
  const noDistrict = address.replace(/,\s*\d{1,2}\.\s*[^,]+/g, '');
  push(noDistrict);

  // street + postcode + city + country
  const parts = noDistrict.split(',').map(s=>s.trim()).filter(Boolean);
  if(parts.length >= 2){
    const street = parts[0];
    const country = parts[parts.length-1];
    const cityPart = parts[parts.length-2];
    const cityNoZip = cityPart.replace(/\b\d{4,5}\b/, '').trim();

    // house number written before the street name -> move it after
    const lead = street.match(/^(\d+[a-zA-Z]?)\s+(.+)$/);
    const streetForms = [street];
    if(lead) streetForms.push(`${lead[2]} ${lead[1]}`);

    // German-language street names are normally hyphenated
    streetForms.slice().forEach(sf=>{
      const m = sf.match(/^(.+?)\s+(\d+\s*[a-zA-Z]?)$/);
      const namePart = m ? m[1] : sf;
      const numPart = m ? m[2] : '';
      if(namePart.split(/\s+/).length >= 3 && !namePart.includes('-')){
        const hyph = namePart.replace(/\s+/g, '-');
        streetForms.push(numPart ? `${hyph} ${numPart}` : hyph);
      }
    });

    streetForms.forEach(sf=>{
      push(`${sf}, ${cityPart}, ${country}`);
      if(cityNoZip) push(`${sf}, ${cityNoZip}, ${country}`);
    });
  }
  return variants;
}

function queryNominatim(q){
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q);
  return fetch(url, {headers:{'Accept':'application/json'}})
    .then(r=>r.ok ? r.json() : [])
    .then(results=>{
      if(results && results.length){
        return {lat:parseFloat(results[0].lat), lng:parseFloat(results[0].lon)};
      }
      return null;
    })
    .catch(()=>null);
}

async function geocodeAddress(address){
  if(geocodeCache[address]) return geocodeCache[address];
  const variants = addressVariants(address);
  for(let i=0; i<variants.length; i++){
    const loc = await queryNominatim(variants[i]);
    if(loc){ geocodeCache[address] = loc; return loc; }
    if(i < variants.length-1) await new Promise(res=>setTimeout(res, 1100));
  }
  return null;
}

function createAccomMarker(it, a, idx, loc, map){
  const stroke = a.selected ? '#0f7a3d' : '#9b9a97';
  const fill = a.selected ? '#ddf3e4' : '#ffffff';
  const marker = L.circleMarker([loc.lat, loc.lng], {
    radius: a.selected ? 8 : 6, color: stroke, weight: 2, fillColor: fill, fillOpacity: 1
  }).addTo(map);
  marker.bindPopup(
    `<b>${a.name}</b>${a.selected?' ✓':''}<br>${a.source} · ${fmt(a.total)}` +
    (a.notes ? `<br><i>"${a.notes}"</i>` : '') +
    `<br><span class="popup-locate-link" onclick="scrollToAccommodation('${it.id}',${idx})">View details ↓</span>`
  );
  accomMarkers[it.id][idx] = marker;
  return marker;
}

async function geocodeAccommodations(it, map){
  accomMarkers[it.id] = [];
  const statusEl = document.getElementById('geo-status-'+it.id);
  let placed = 0;
  for(let idx=0; idx<it.accommodations.length; idx++){
    const a = it.accommodations[idx];
    const loc = await geocodeAddress(a.address);
    if(loc){ createAccomMarker(it, a, idx, loc, map); placed++; }
    if(statusEl){
      statusEl.innerHTML = `<span class="geo-dot"></span> Locating accommodation pins… ${placed}/${it.accommodations.length}`;
    }
    await new Promise(res=>setTimeout(res, 1100));
  }
  if(statusEl){
    statusEl.innerHTML = `<span class="geo-dot done"></span> ${placed} of ${it.accommodations.length} accommodation pins located`;
    setTimeout(()=>{ if(statusEl) statusEl.style.display='none'; }, 3000);
  }
}

async function locateAccommodation(itId, idx, btn){
  const it = DATA.find(x=>x.id===itId);
  const map = mapInstances[itId];

  // highlight the row straight away so the click always gives feedback
  document.querySelectorAll('.accom-row').forEach(el=>el.classList.remove('highlight'));
  const row = document.getElementById('accom-'+itId+'-'+idx);
  if(row) row.classList.add('highlight');

  const mapEl = document.getElementById('map-'+itId);
  if(mapEl) mapEl.scrollIntoView({behavior:'smooth', block:'center'});
  if(!map || !it) return;

  accomMarkers[itId] = accomMarkers[itId] || [];
  let marker = accomMarkers[itId][idx];

  // pin not ready yet (still geocoding, or the address failed earlier) — fetch it now
  if(!marker){
    const original = btn ? btn.innerHTML : null;
    if(btn){ btn.innerHTML = '⏳ Locating…'; btn.disabled = true; }
    const loc = await geocodeAddress(it.accommodations[idx].address);
    if(btn){ btn.innerHTML = original; btn.disabled = false; }
    if(loc) marker = createAccomMarker(it, it.accommodations[idx], idx, loc, map);
  }

  if(!marker){
    if(btn){
      const original = btn.innerHTML;
      btn.innerHTML = '📍 Not found';
      setTimeout(()=>{ btn.innerHTML = original; }, 2000);
    }
    return;
  }

  // wait for the smooth scroll to settle, then move the map deterministically
  setTimeout(()=>{
    map.invalidateSize();
    map.setView(marker.getLatLng(), 14, {animate:true, duration:0.6});
    setTimeout(()=>marker.openPopup(), 400);
  }, 500);
}

function scrollToAccommodation(itId, idx){
  const row = document.getElementById('accom-'+itId+'-'+idx);
  if(row){
    row.scrollIntoView({behavior:'smooth', block:'center'});
    document.querySelectorAll('.accom-row').forEach(el=>el.classList.remove('highlight'));
    row.classList.add('highlight');
    setTimeout(()=>row.classList.remove('highlight'), 2600);
  }
}

function selectPage(id){
  document.querySelectorAll('.side-item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  document.querySelectorAll('.page').forEach(el=>el.classList.toggle('active', el.id==='page-'+id));
  const it = DATA.find(x=>x.id===id);
  requestAnimationFrame(()=>initMap(it));
  window.scrollTo({top:0});
}

renderSidebar();
renderMain();
initMap(DATA[0]);
</script>
